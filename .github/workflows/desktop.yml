name: Windows desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: uv --directory backend sync --locked --group desktop
      - name: Backend tests and lint
        shell: pwsh
        run: |
          uv --directory backend run --locked --group desktop python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv --directory backend run --locked --group desktop ruff check --config pyproject.toml . ../scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend tests
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build single-file desktop app
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Verify and prepare release assets
        shell: pwsh
        run: uv --directory backend run --locked --group desktop python ../scripts/desktop_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-desktop
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-desktop
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt \
            --verify-tag --title "EasyTrip $RELEASE_TAG" --notes-file release/release-notes.md

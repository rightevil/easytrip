[project]
name = "easytrip"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=1.30,<2",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
desktop = [
    "pyinstaller>=6.22,<7 ; sys_platform == 'win32'",
    "pywebview>=6,<7 ; sys_platform == 'win32'",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
